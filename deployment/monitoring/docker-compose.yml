# полный стек: сервис film-camera (:8010) + Prometheus (:9090) + Grafana (:3001)
# образ film-camera собирается отдельно (docker build -t film-camera . в корне репо, см README)
# Prometheus скрейпит host.docker.internal:8010 (контейнер сервиса публикует 8010), Grafana настраивается руками
# порты подобраны под занятые на машине: Prometheus 9090, Grafana 3001 (3000 занят)

services:
  # сервис: готовый образ film-camera (собери его до docker compose up, см README)
  film-service:
    image: film-camera
    container_name: film-service
    restart: unless-stopped
    ports:
      - "8010:7860"

  prometheus:
    image: prom/prometheus:latest
    container_name: film-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: film-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # публичный дашборд открыт как read-only (анонимный Viewer), админ-пароль не дефолтный
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
