[flake8]
max-line-length = 120
# E402: локальные импорты после sys.path.insert (by design); E203/W503: black-совместимость
extend-ignore = E203, W503, E402
exclude = .venv, .git, __pycache__, training/artifacts, training/notebooks, training/tracking/store
per-file-ignores =
    __init__.py:F401
    training/validation/settings.py:F401
