# Таксономия классов и схема разметки для проекта film_camera_body_type
# Источники: problem-validation/ANALYSIS.md, solution-design/README.md
# Используется при ручной разметке, в промпте LLM и при валидации меток

project: film-camera-body-type
category: 'Электроника / Фототехника / Плёночные фотоаппараты'
target_attribute: film_camera_body_type


# --------------------------------------------------------------------
# Первый уровень разметки: что за объект в объявлении
# Декомпозиция нужна, чтобы отделить ошибки "не та камера" от ошибок
# "вообще не камера / лот / коробка". Если object_status отличается
# от valid_single_film_camera, body_type не ставится
# --------------------------------------------------------------------
object_status:

  valid_single_film_camera:
    description: 'Одна плёночная камера в объявлении, по которой можно определить тип корпуса'

  multi_camera_lot:
    description: 'Несколько камер в одном объявлении, особенно разных типов'
    source_note: 'problem-validation/ANALYSIS.md: лот из нескольких камер, строки 15, 26, 43'
    examples:
      - 'лот из Зенитов и Смен'
      - 'набор камер СССР'

  accessory_or_part:
    description: 'Только аксессуар или часть камеры: объектив, вспышка, ремень, чехол, крышка, экспонометр'
    source_note: 'solution-design/README.md: other_unknown включает аксессуары'

  film_or_consumable:
    description: 'Расходник без камеры: плёнка, кассета, картридж, химия, фотобумага'
    source_note: 'problem-validation/ANALYSIS.md: строка 45 (плёнка Kodak Charmera)'

  digital_camera:
    description: 'Объявление про цифровую камеру, попало в категорию плёночных по ошибке'
    source_note: 'solution-design/README.md: other_unknown включает цифровую камеру'

  box_manual_packaging:
    description: 'В объявлении только коробка, инструкция или упаковка без самой камеры'
    source_note: 'problem-validation/ANALYSIS.md: на фото коробка или чехол, строки 2, 14, 20, 28, 32, 36, 38'

  not_camera:
    description: 'В объявлении вообще не камера и не аксессуар к ней'

  insufficient_info:
    description: 'По тексту и фото нельзя надёжно понять, какой это тип корпуса (текст бедный, фото ничего не даёт)'
    source_note: 'problem-validation/ANALYSIS.md: заголовок "Фотоаппарат" без модели, строки 6, 24, 33'

  image_unavailable:
    description: 'Главное фото недоступно или битое, а одного текста для решения не хватает'
    source_note: 'solution-design/README.md: ветка input_unavailable в схеме сервиса'

  conflicting_evidence:
    description: 'Текст и фото явно противоречат друг другу, и неясно, чему верить'
    source_note: 'problem-validation/ANALYSIS.md: заголовок "Зенит ттл" при чехле на главном фото'


# --------------------------------------------------------------------
# Второй уровень разметки: тип корпуса валидной плёночной камеры
# Визуальные признаки и описания взяты из problem-validation/ANALYSIS.md
# (таблица "Что видит человек") и из solution-design/README.md
# --------------------------------------------------------------------
body_type:

  SLR:
    description: 'Однообъективная зеркальная плёночная камера'
    visual_markers: 'Призменный выступ сверху, объектив по центру'
    examples:
      - 'Зенит TTL'
      - 'Nikon FM'
      - 'Canon EOS'

  TLR:
    description: 'Двухобъективная зеркальная плёночная камера'
    visual_markers: 'Две линзы одна над другой'
    examples:
      - 'Любитель'
      - 'Rolleiflex'
      - 'Yashica Mat'

  rangefinder_viewfinder:
    description: 'Дальномерная, шкальная или простая видоискательная камера без зеркальной призмы. Дальномерная и видоискательная объединены в один класс, потому что по фото их часто нельзя различить без знания модели'
    visual_markers: 'Плоский корпус, отдельное окно видоискателя'
    examples:
      - 'Зоркий 6'
      - 'Leica III'

  compact_point_and_shoot:
    description: 'Компактная автоматическая плёночная камера ("мыльница"), включая одноразовые'
    visual_markers: 'Небольшой корпус, встроенная вспышка, простая форма'
    examples:
      - 'Olympus mju II'

  instant:
    description: 'Камера моментальной печати (Polaroid, Instax)'
    visual_markers: 'Широкий корпус, слот выхода фото'
    examples:
      - 'Polaroid'
      - 'Instax'


# --------------------------------------------------------------------
# Финальная метка для модели
# Все невалидные и спорные случаи сворачиваются в other_unknown
# --------------------------------------------------------------------
final_label:
  rules:
    - 'object_status == valid_single_film_camera И body_type задан -> final_label = body_type'
    - 'иначе -> final_label = other_unknown'

  values:
    - SLR
    - TLR
    - rangefinder_viewfinder
    - compact_point_and_shoot
    - instant
    - other_unknown


# --------------------------------------------------------------------
# Схема таблицы разметки (data/labeling/gold.parquet, потом data/training/labels_final.parquet)
# 12 колонок, минимально необходимых для одной недели работы
# --------------------------------------------------------------------
dataset_schema:

  - name: item_id
    type: string
    description: 'ID объявления из исходного CSV. Первичный ключ'

  - name: user_id
    type: string
    description: 'ID продавца. Используется для group split, не как фича'

  - name: title
    type: string
    description: 'Заголовок объявления (копия из CSV, для удобства разметки)'

  - name: description
    type: string
    description: 'Описание объявления (копия из CSV)'

  - name: image_id
    type: int64
    description: 'ID картинки. Путь к файлу: data/raw/image/{image_id % 1000}/{image_id}.jpg'

  - name: object_status
    type: category
    description: 'Первый уровень разметки (см. секцию object_status выше)'

  - name: body_type
    type: category_nullable
    description: 'Второй уровень разметки. null, если object_status != valid_single_film_camera'

  - name: final_label
    type: category
    description: 'Финальная метка для модели (см. секцию final_label выше)'

  - name: model_name
    type: string_nullable
    description: 'Извлечённая модель камеры, если очевидна. Накапливается в kb.yaml'

  - name: evidence
    type: string_nullable
    description: 'Короткое объяснение метки: "Зенит TTL в заголовке", "призменный выступ на фото", "в объявлении лот"'

  - name: label_source
    type: category
    description: 'Источник метки: human / kb / rules / llm / review'

  - name: confidence
    type: float
    description: 'Уверенность метки от 0 до 1. Для ручной разметки фиксируется как 1.0'
